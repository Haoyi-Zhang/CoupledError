name: Scientific checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install numerical candidate locator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p046-scientific-evidence"
          python -B -m pip install --only-binary=:all: numpy==2.1.3 scipy==1.14.1 2>&1 | tee "$RUNNER_TEMP/p046-scientific-evidence/dependencies.log"
          python -B -m pip freeze > "$RUNNER_TEMP/p046-scientific-evidence/packages.txt"
      - name: Reproduce finite results with exact failure gates
        shell: bash
        run: |
          set -euo pipefail
          test -f reproduce.py
          test -f src/order_verify.py
          python -B tests/coefficient_regression.py > "$RUNNER_TEMP/p046-scientific-evidence/coefficient-regression.log" 2>&1 || { cat "$RUNNER_TEMP/p046-scientific-evidence/coefficient-regression.log"; exit 1; }
          ulimit -v 3584000
          ulimit -t 300
          timeout --signal=TERM --kill-after=10s 240s python -B reproduce.py --output-dir "$RUNNER_TEMP/p046-scientific-evidence/reproduction" 2>&1 | tee "$RUNNER_TEMP/p046-scientific-evidence/reproduction.log"
      - name: Upload raw evidence even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p046-scientific-output
          path: ${{ runner.temp }}/p046-scientific-evidence
          if-no-files-found: warn
          retention-days: 14
